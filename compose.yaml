name: prakwebservice-lab10
services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: lab10-rabbit
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
volumes:
  rabbit-data:
